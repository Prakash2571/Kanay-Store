<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Pump bottle of skincare on a studio backdrop">
  <!-- Kanay Store category imagery: a rendered product shot on a studio backdrop.
       Drawn rather than photographed because the build environment has no outbound network, so a
       photograph can be neither downloaded nor verified - and the previous attempt at stock URLs
       shipped a 404 and a miscaptioned image (see src/lib/storefront/categoryMedia.ts).
       Backdrop and product tones derive from this department's tint tokens in globals.css.
       To use a real photograph instead: ./scripts/add-category-photo.sh beauty <url-or-file>
       Raster files take priority over this file automatically. -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#fdf1ec"/>
      <stop offset="0.62" stop-color="#fbdfd4"/>
      <stop offset="1" stop-color="#ddc4bb"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e4ae9f"/>
      <stop offset="0.45" stop-color="#d98b76"/>
      <stop offset="1" stop-color="#7a3527"/>
    </linearGradient>
    <linearGradient id="bodyAlt" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#7a3527"/>
      <stop offset="0.55" stop-color="#d98b76"/>
      <stop offset="1" stop-color="#5c281d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eecbc1"/>
      <stop offset="0.28" stop-color="#de9986"/>
      <stop offset="0.55" stop-color="#b27261"/>
      <stop offset="0.78" stop-color="#e1a594"/>
      <stop offset="1" stop-color="#682d21"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#463e3b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#463e3b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3d1a14" flood-opacity="0.30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#sweep)"/>
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="400" cy="510" rx="138" ry="26" fill="url(#contact)"/>
  <g filter="url(#drop)">
    <rect x="378" y="238" width="44" height="52" fill="url(#bodyAlt)"/>
    <rect x="354" y="200" width="92" height="42" rx="16" fill="url(#bodyAlt)"/>
    <rect x="446" y="212" width="52" height="18" rx="9" fill="url(#bodyAlt)"/>
    <rect x="326" y="284" width="148" height="204" rx="34" fill="url(#body)"/>
    <path d="M326 392h148v62a34 34 0 0 1-34 34h-80a34 34 0 0 1-34-34z" fill="#55251b" opacity="0.35"/>
    <rect x="346" y="304" width="34" height="150" rx="17" fill="url(#gloss)"/>
    <rect x="446" y="312" width="12" height="120" rx="6" fill="#ffffff" opacity="0.18"/>
    <rect x="362" y="210" width="26" height="24" rx="10" fill="#ffffff" opacity="0.30"/>
  </g>
  <rect width="800" height="640" filter="url(#grain)" opacity="0.05"/>
</svg>
