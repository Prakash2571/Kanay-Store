<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Adjustable wrench on a studio backdrop">
  <!-- Kanay Store category imagery: a rendered product shot on a studio backdrop.
       Drawn rather than photographed because the build environment has no outbound network, so a
       photograph can be neither downloaded nor verified - and the previous attempt at stock URLs
       shipped a 404 and a miscaptioned image (see src/lib/storefront/categoryMedia.ts).
       Backdrop and product tones derive from this department's tint tokens in globals.css.
       To use a real photograph instead: ./scripts/add-category-photo.sh tools <url-or-file>
       Raster files take priority over this file automatically. -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#fef8dd"/>
      <stop offset="0.62" stop-color="#fcefb4"/>
      <stop offset="1" stop-color="#ded29e"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b8bfc6"/>
      <stop offset="0.45" stop-color="#9aa3ad"/>
      <stop offset="1" stop-color="#3d444d"/>
    </linearGradient>
    <linearGradient id="bodyAlt" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#3d444d"/>
      <stop offset="0.55" stop-color="#9aa3ad"/>
      <stop offset="1" stop-color="#2e333a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2d6da"/>
      <stop offset="0.28" stop-color="#a6aeb7"/>
      <stop offset="0.55" stop-color="#7e868e"/>
      <stop offset="0.78" stop-color="#b0b7bf"/>
      <stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#474332" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#474332" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e2226" flood-opacity="0.30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#sweep)"/>
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="400" cy="518" rx="176" ry="28" fill="url(#contact)"/>
  <g filter="url(#drop)" transform="rotate(-36 400 330)">
    <rect x="372" y="222" width="56" height="228" rx="24" fill="url(#metal)"/>
    <rect x="382" y="236" width="16" height="198" rx="8" fill="#ffffff" opacity="0.22"/>
    <path d="M348 168h104v72h-104z" fill="url(#metal)"/>
    <rect x="382" y="156" width="36" height="56" rx="8" fill="#e3d7a2"/>
    <path d="M348 432h104v74h-104z" fill="url(#metal)"/>
    <rect x="382" y="452" width="36" height="60" rx="8" fill="#e3d7a2"/>
    <rect x="360" y="292" width="80" height="18" rx="9" fill="#2b3036" opacity="0.35"/>
    <rect x="360" y="322" width="80" height="18" rx="9" fill="#2b3036" opacity="0.35"/>
  </g>
  <rect width="800" height="640" filter="url(#grain)" opacity="0.05"/>
</svg>
