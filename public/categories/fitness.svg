<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Sports and fitness">
  <!-- Kanay Store category artwork. Flat vector, colours taken from this department's tint tokens
       in src/app/globals.css. Committed rather than fetched: hard-coded stock photo URLs produced a
