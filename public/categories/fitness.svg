  <circle cx="612" cy="126" r="78" fill="#6cc4b6" opacity="0.26"/>
  <circle cx="176" cy="512" r="104" fill="#6cc4b6" opacity="0.22"/>
  <rect x="332" y="306" width="136" height="32" rx="16" fill="#0b6b5f"/>
  <rect x="278" y="268" width="34" height="108" rx="15" fill="#0b6b5f"/>
  <rect x="244" y="288" width="28" height="68" rx="13" fill="#6cc4b6"/>
