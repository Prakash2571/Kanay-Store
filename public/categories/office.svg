<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Stack of notebooks with a pen on a studio backdrop">
  <!-- Kanay Store category imagery: a rendered product shot on a studio backdrop.
       Drawn rather than photographed because the build environment has no outbound network, so a
       photograph can be neither downloaded nor verified - and the previous attempt at stock URLs
       shipped a 404 and a miscaptioned image (see src/lib/storefront/categoryMedia.ts).
       Backdrop and product tones derive from this department's tint tokens in globals.css.
       To use a real photograph instead: ./scripts/add-category-photo.sh office <url-or-file>
       Raster files take priority over this file automatically. -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset="0.62" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#c7ccd3"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b1bac6"/>
      <stop offset="0.45" stop-color="#8f9dae"/>
      <stop offset="1" stop-color="#39434f"/>
    </linearGradient>
    <linearGradient id="bodyAlt" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#39434f"/>
      <stop offset="0.55" stop-color="#8f9dae"/>
      <stop offset="1" stop-color="#2b323b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd3db"/>
      <stop offset="0.28" stop-color="#9ca9b8"/>
      <stop offset="0.55" stop-color="#75818f"/>
      <stop offset="0.78" stop-color="#a8b3c0"/>
      <stop offset="1" stop-color="#303943"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3f4143" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3f4143" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1c2228" flood-opacity="0.30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#sweep)"/>
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="400" cy="492" rx="196" ry="28" fill="url(#contact)"/>
  <g filter="url(#drop)">
    <rect x="268" y="404" width="264" height="54" rx="14" fill="url(#bodyAlt)"/>
    <rect x="278" y="410" width="244" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
    <rect x="286" y="342" width="252" height="58" rx="14" fill="url(#body)"/>
    <rect x="296" y="348" width="232" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="256" y="276" width="266" height="62" rx="16" fill="url(#bodyAlt)"/>
    <rect x="266" y="282" width="246" height="15" rx="7" fill="#ffffff" opacity="0.5"/>
    <rect x="290" y="290" width="26" height="42" rx="8" fill="#ffffff" opacity="0.22"/>
    <g transform="rotate(-16 400 250)">
      <rect x="300" y="234" width="212" height="20" rx="10" fill="url(#metal)"/>
      <path d="M512 234l38 10-38 10z" fill="#282f37"/>
      <rect x="312" y="238" width="120" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
  <rect width="800" height="640" filter="url(#grain)" opacity="0.05"/>
</svg>
