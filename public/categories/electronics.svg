<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Over-ear headphones on a studio backdrop">
  <!-- Kanay Store category imagery: a rendered product shot on a studio backdrop.
       Drawn rather than photographed because the build environment has no outbound network, so a
       photograph can be neither downloaded nor verified - and the previous attempt at stock URLs
       shipped a 404 and a miscaptioned image (see src/lib/storefront/categoryMedia.ts).
       Backdrop and product tones derive from this department's tint tokens in globals.css.
       To use a real photograph instead: ./scripts/add-category-photo.sh electronics <url-or-file>
       Raster files take priority over this file automatically. -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.62" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c1cee0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#799ae4"/>
      <stop offset="0.45" stop-color="#3f6fd8"/>
      <stop offset="1" stop-color="#16307a"/>
    </linearGradient>
    <linearGradient id="bodyAlt" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#16307a"/>
      <stop offset="0.55" stop-color="#3f6fd8"/>
      <stop offset="1" stop-color="#10245c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9beed"/>
      <stop offset="0.28" stop-color="#5680dd"/>
      <stop offset="0.55" stop-color="#345bb1"/>
      <stop offset="0.78" stop-color="#698fe1"/>
      <stop offset="1" stop-color="#132968"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3d4247" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3d4247" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b183d" flood-opacity="0.30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#sweep)"/>
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="400" cy="512" rx="196" ry="34" fill="url(#contact)"/>
  <g filter="url(#drop)">
    <path d="M244 352a156 156 0 0 1 312 0" fill="none" stroke="url(#metal)" stroke-width="40" stroke-linecap="round"/>
    <path d="M244 352a156 156 0 0 1 312 0" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="9" stroke-linecap="round" transform="translate(0,-11)"/>
    <rect x="196" y="330" width="104" height="172" rx="50" fill="url(#body)"/>
    <rect x="500" y="330" width="104" height="172" rx="50" fill="url(#bodyAlt)"/>
    <rect x="210" y="344" width="46" height="128" rx="23" fill="url(#gloss)"/>
    <ellipse cx="248" cy="416" rx="30" ry="52" fill="#0f2255" opacity="0.55"/>
    <ellipse cx="552" cy="416" rx="30" ry="52" fill="#0f2255" opacity="0.65"/>
    <ellipse cx="248" cy="416" rx="19" ry="36" fill="#6f93e2" opacity="0.5"/>
  </g>
  <rect width="800" height="640" filter="url(#grain)" opacity="0.05"/>
</svg>
