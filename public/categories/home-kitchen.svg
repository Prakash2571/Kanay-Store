<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Stainless saucepan with lid on a studio backdrop">
  <!-- Kanay Store category imagery: a rendered product shot on a studio backdrop.
       Drawn rather than photographed because the build environment has no outbound network, so a
       photograph can be neither downloaded nor verified - and the previous attempt at stock URLs
       shipped a 404 and a miscaptioned image (see src/lib/storefront/categoryMedia.ts).
       Backdrop and product tones derive from this department's tint tokens in globals.css.
       To use a real photograph instead: ./scripts/add-category-photo.sh home-kitchen <url-or-file>
       Raster files take priority over this file automatically. -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#edf8ef"/>
      <stop offset="0.62" stop-color="#d6f0dc"/>
      <stop offset="1" stop-color="#bcd3c2"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a5baaa"/>
      <stop offset="0.45" stop-color="#7f9d86"/>
      <stop offset="1" stop-color="#2b3f31"/>
    </linearGradient>
    <linearGradient id="bodyAlt" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2b3f31"/>
      <stop offset="0.55" stop-color="#7f9d86"/>
      <stop offset="1" stop-color="#202f25"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5d3c9"/>
      <stop offset="0.28" stop-color="#8ea995"/>
      <stop offset="0.55" stop-color="#68816e"/>
      <stop offset="0.78" stop-color="#9bb3a1"/>
      <stop offset="1" stop-color="#25362a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3c433e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3c433e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#162018" flood-opacity="0.30"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#sweep)"/>
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="400" cy="500" rx="182" ry="30" fill="url(#contact)"/>
  <g filter="url(#drop)">
    <rect x="508" y="322" width="132" height="30" rx="15" fill="url(#metal)"/>
    <path d="M282 300h236v122a48 48 0 0 1-48 48H330a48 48 0 0 1-48-48z" fill="url(#metal)"/>
    <rect x="308" y="316" width="34" height="128" rx="17" fill="url(#gloss)"/>
    <rect x="470" y="322" width="16" height="112" rx="8" fill="#ffffff" opacity="0.16"/>
    <ellipse cx="400" cy="300" rx="118" ry="22" fill="#1e2c22" opacity="0.85"/>
    <ellipse cx="400" cy="294" rx="118" ry="21" fill="url(#metal)"/>
    <ellipse cx="400" cy="290" rx="92" ry="14" fill="#ffffff" opacity="0.22"/>
    <rect x="384" y="256" width="32" height="30" rx="10" fill="url(#bodyAlt)"/>
    <ellipse cx="400" cy="252" rx="26" ry="12" fill="url(#metal)"/>
  </g>
  <rect width="800" height="640" filter="url(#grain)" opacity="0.05"/>
</svg>
