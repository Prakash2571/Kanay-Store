  <g fill="#8a6a45">
    <rect x="770" y="828" width="500" height="22" rx="5"/>
    <rect x="790" y="850" width="40" height="34" rx="4"/>
    <rect x="1000" y="850" width="40" height="34" rx="4"/>
    <rect x="1210" y="850" width="40" height="34" rx="4"/>
  </g>

  <rect width="1920" height="1080" fill="url(#pool)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
</svg>
