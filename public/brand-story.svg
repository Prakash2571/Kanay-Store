      <rect x="1670" y="504.5" width="200" height="7.425" fill="#7b6a58" opacity="0.35"/>
    </g>
    <g>
      <path d="M1230 300 l34 -17.0 h200 l-34 17.0 z" fill="#c9b49d"/>
      <path d="M1430 300 l34 -17.0 v155 l-34 17.0 z" fill="#8e785f"/>
      <rect x="1230" y="300" width="200" height="155" fill="#b69a7a"/>
      <rect x="1322.0" y="300" width="14.000000000000002" height="155" fill="#786651" opacity="0.55"/>
      <rect x="1230" y="346.5" width="200" height="6.975" fill="#786651" opacity="0.35"/>
    </g>
    <g>
      <path d="M1450 300 l34 -17.0 h200 l-34 17.0 z" fill="#bfad97"/>
      <path d="M1650 300 l34 -17.0 v155 l-34 17.0 z" fill="#83705a"/>
      <rect x="1450" y="300" width="200" height="155" fill="#a89073"/>
      <rect x="1542.0" y="300" width="14.000000000000002" height="155" fill="#6f5f4c" opacity="0.55"/>
      <rect x="1450" y="346.5" width="200" height="6.975" fill="#6f5f4c" opacity="0.35"/>
    </g>
  </g>
  <g stroke="#66727f" stroke-opacity="0.35" stroke-width="14" filter="url(#soften)">
    <path d="M100 300v330"/><path d="M745 300v330"/><path d="M1210 280v350"/><path d="M1890 280v350"/>
  </g>

  <!-- Foreground stack, plus its pallet and contact shadow. -->
  <ellipse cx="1050" cy="845" rx="330" ry="46" fill="#4b5563" opacity="0.35"/>
    <g>
      <path d="M790 620 l46 -23.0 h250 l-46 23.0 z" fill="#d6b48c"/>
      <path d="M1040 620 l46 -23.0 v205 l-46 23.0 z" fill="#9c784d"/>
      <rect x="790" y="620" width="250" height="205" fill="#c89a63"/>
