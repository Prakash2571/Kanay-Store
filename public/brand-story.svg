      <rect x="790" y="681.5" width="250" height="9.225" fill="#846641" opacity="0.35"/>
    </g>
    <g>
      <path d="M1000 620 l46 -23.0 h250 l-46 23.0 z" fill="#dbbd9a"/>
      <path d="M1250 620 l46 -23.0 v205 l-46 23.0 z" fill="#a1815c"/>
      <rect x="1000" y="620" width="250" height="205" fill="#cfa676"/>
      <rect x="1115.0" y="620" width="17.5" height="205" fill="#896e4e" opacity="0.55"/>
      <rect x="1000" y="681.5" width="250" height="9.225" fill="#896e4e" opacity="0.35"/>
    </g>
    <g>
      <path d="M860 425 l46 -23.0 h250 l-46 23.0 z" fill="#cdae87"/>
      <path d="M1110 425 l46 -23.0 v195 l-46 23.0 z" fill="#937149"/>
      <rect x="860" y="425" width="250" height="195" fill="#bc915d"/>
      <rect x="975.0" y="425" width="17.5" height="195" fill="#7c603d" opacity="0.55"/>
      <rect x="860" y="483.5" width="250" height="8.775" fill="#7c603d" opacity="0.35"/>
