name: CI

# Runs on every push and PR.
#
# This repository shipped without CI, so nothing had ever verified that it
# typechecks, lints, tests or builds. The build step matters most: Next only
# reports type errors and bad imports at build time, so a broken import could
# reach main unnoticed and then fail in the Docker image instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Matches the Dockerfile, which builds on node:24-alpine. Testing on a
      # different major to the one that ships is how a runtime-only failure hides.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` ONLY - never `npm install`. package-lock.json is committed
      # (lockfileVersion 3, every entry carrying an integrity hash), so this
      # installs the exact resolved tree and fails loudly if the lockfile and
      # package.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Deliberately built with NO backend URL configured. The storefront must
      # build without one - pages fall back to a "temporarily unavailable" state
      # rather than throwing - and this proves that holds. A build that silently
      # required production configuration would only fail once deployed.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # output: 'standalone' is what the Docker runner stage copies. If a config
      # change silently drops it, the image builds and then fails to start, which
      # is a far more expensive way to find out.
      - name: Assert standalone output was produced
        run: |
          test -f .next/standalone/server.js \
            || { echo "::error title=No standalone output::.next/standalone/server.js is missing. next.config.ts must set output: 'standalone' for the Docker image to work."; exit 1; }
          echo "standalone output present"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build only - nothing is pushed. Catches a Dockerfile that has drifted
      # from the source layout, which the Node job above cannot see.
      - name: Build storefront image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------------------------------------------------------------------
# Branch protection (manual step - a workflow cannot grant itself authority)
#
# Settings -> Branches -> add a rule for `main`:
#   - Require a pull request before merging
#   - Require status checks to pass:
#       "typecheck, lint, test, build"
#       "docker image"
#   - Require branches to be up to date before merging
#
# Without this, a red CI run does not actually block the merge button.
# ---------------------------------------------------------------------------
