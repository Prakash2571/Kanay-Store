name: Secret scan

# Two separate questions, neither of which had any check:
#
#   1. Did a credential get committed to the repository?
#   2. Did a server-side value get COMPILED INTO the browser bundle?
#
# The second is specific to a Next storefront and is the one that leaks silently. Next
# inlines every NEXT_PUBLIC_* variable into client JavaScript at build time, so a
# credential given a NEXT_PUBLIC_ name is published to every visitor - and nothing about
# that looks wrong in a code review.
#
# CALIBRATION MATTERS MORE THAN COVERAGE
# -------------------------------------
# The patterns below match credential SHAPES, not the words "token" or "secret". An
# earlier draft matched the words and fired on .env.example placeholders, documentation
# and the redaction test fixtures - and a check that cries wolf is one people learn to
# ignore, which is worse than no check. Shopify token rules therefore require 32+ chars
# (a real token's length, so short test fixtures do not match), the Mongo rule excludes
# angle brackets so <user>:<password> templates do not match, and a placeholder filter
# drops the remaining documentation cases.
#
# Verified both ways before being committed: zero hits across all three Trademart repos,
# and all five planted credential shapes detected.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-secrets:
    name: no credentials in source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scan for credential-shaped literals
        run: |
          set -uo pipefail
          PATTERNS='shpat_[A-Za-z0-9]{32,}'
          PATTERNS="$PATTERNS|shpca_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|shpss_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|rzp_live_[A-Za-z0-9]{10,}"
          PATTERNS="$PATTERNS|sk_live_[A-Za-z0-9]{16,}"
          PATTERNS="$PATTERNS|mongodb(\+srv)?://[^:@/[:space:]<>]+:[^@[:space:]<>]+@"

          # Credentials that legitimately appear in templates, docs and test fixtures.
          PLACEHOLDER='user:pass@|user:password@|username:password@|<user>|<password>|changeme|placeholder|example\.com|YOUR_|xxxx|redacted'

          HITS=$(grep -rInE "$PATTERNS" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude=package-lock.json \
            --exclude=secret-scan.yml 2>/dev/null | grep -viE "$PLACEHOLDER" || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Credential in source::A credential-shaped literal is committed. ROTATE IT FIRST, then remove it from the repository - git history keeps the old value."
            echo "$HITS"
            exit 1
          fi
          echo "no credential-shaped literals found"

      - name: Assert no .env file is tracked
        run: |
          set -uo pipefail
          # .env.example is the committed template and is expected. A real .env is not.
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error title=.env committed::A .env file is tracked. Only .env.example belongs in the repository."
            echo "$TRACKED"
            exit 1
          fi
          echo "no tracked .env files"

      - name: Assert no NEXT_PUBLIC_ variable is credential-named
        run: |
          set -uo pipefail
          # The actual mistake this guards: giving a credential a NEXT_PUBLIC_ name. Next
          # inlines it into client JavaScript and nothing else would notice.
          MATCHES=$(grep -rhoE 'NEXT_PUBLIC_[A-Z0-9_]+' src/ 2>/dev/null | sort -u \
            | grep -E '(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE|APIKEY|API_KEY)' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error title=Public credential name::These NEXT_PUBLIC_ variables look like credentials. NEXT_PUBLIC_* is inlined into client JavaScript, so they would be readable by every visitor:"
            echo "$MATCHES"
            exit 1
          fi
          echo "no credential-named NEXT_PUBLIC_ variables"

  client-bundle:
    name: no server secrets in the client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Built with NO secrets configured, exactly as the CI build does. The point is not
      # to test a value but to inspect which NAMES the compiler inlined.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Assert no server-only secret names in .next/static
        run: |
          set -uo pipefail
          FORBIDDEN='SHOPIFY_ACCESS_TOKEN|SHOPIFY_CLIENT_SECRET|SHOPIFY_WEBHOOK_SECRET|SHOPIFY_STOREFRONT_API_TOKEN|RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|MONGODB_URI|OPERATOR_API_KEY|OPERATOR_PASSWORD|SESSION_SECRET|TOKEN_ENCRYPTION_KEY|TRACKING_TOKEN_SECRET'
          # .next/static is what a browser downloads.
          FOUND=$(grep -rlE "$FORBIDDEN" .next/static 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error title=Secret name in client bundle::A server-only variable name appears in .next/static, which is served to browsers:"
            echo "$FOUND"
            exit 1
          fi
          echo "no server-only secret names in the client bundle"
